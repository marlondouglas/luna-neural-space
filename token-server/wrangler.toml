name = "luna-token-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Valores públicos (não são segredos).
[vars]
LIVEKIT_URL = "wss://luna-neural-space-vmz1wywd.livekit.cloud"
LIVEKIT_API_KEY = "APIhv8yaezaW7g8"
# Prefixo obrigatório do nome da sala.
ROOM_PREFIX = "luna-"
# Validade do token, em segundos (4 horas).
TOKEN_TTL_SECONDS = "14400"
# Modelo principal da conversa com a Luna (POST /chat): Gemini.
GEMINI_MODEL = "gemini-flash-latest"
# Modelo reserva do Workers AI, usado se o Gemini falhar.
CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Voz da Luna (POST /tts): Gemini TTS, voz Kore. Reserva: Workers AI (melotts).
TTS_MODEL = "gemini-2.5-flash-preview-tts"
TTS_VOICE = "Kore"

# Licença (teste grátis + assinatura). Ver src/license.ts e src/licenseRoutes.ts.
FIREBASE_PROJECT_ID = "gen-lang-client-0729741193"
TRIAL_DAYS = "7"
# Quanto tempo o app funciona sem internet com a última licença assinada.
GRACE_HOURS = "48"
# Uma conta em no máximo N aparelhos (troca de celular: tools/unlock.sh reset-devices).
MAX_DEVICES = "3"
# Versões abaixo desta são bloqueadas ("Atualize o app"). 106 = v0.1.6 (primeira com a trava).
MIN_VERSION_CODE = "106"
DOWNLOAD_URL = "https://marlondouglas.github.io/luna-neural-space/download.html"
# Link de pagamento (InfinitePay). Trocar sem deploy: tools/unlock.sh checkout <url>.
CHECKOUT_URL = "https://checkout.infinitepay.io/mduseimports/nDdXiu2DrZ"
# "1" = /chat, /tts e /receipt exigem conta com teste/assinatura em dia.
LICENSE_ENFORCE = "1"

# KV das licenças (criado em 18/10/2026 com:
#   npx wrangler kv namespace create LICENSES)
[[kv_namespaces]]
binding = "LICENSES"
id = "89768b66358940df96f290bedded04eb"

# Workers AI (plano gratuito), usado em POST /chat.
[ai]
binding = "AI"

# Segredos (NUNCA neste arquivo):
#   npx wrangler secret put LIVEKIT_API_SECRET
#   npx wrangler secret put APP_SHARED_KEY   (opcional)
#   npx wrangler secret put GEMINI_API_KEY   (chave do Gemini para /chat)
#   npx wrangler secret put LICENSE_SIGNING_KEY  (JWK privada ECDSA P-256; arquivo fora do repo)
#   npx wrangler secret put ADMIN_SECRET         (token do tools/unlock.sh; arquivo fora do repo)
#   npx wrangler secret put INFINITEPAY_WEBHOOK_SECRET (segredo do webhook; arquivo fora do repo)
