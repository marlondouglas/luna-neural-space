name: Rota GV - Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/0.1.12-correcoes
      - consolidacao-0.1.12

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER_PATH=""
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="$ANDROID_SDK_ROOT/cmdline-tools/tools/bin/sdkmanager"
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/tools/bin:$PATH"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_PATH="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager nao encontrado"
            exit 1
          fi
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER_PATH" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: rota-gv-0.1.12-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
