name: Publicar ROTA GV 0.1.17

on:
  push:
    branches:
      - codex/0.1.17-progress
    paths:
      - ".github/workflows/publish-0.1.17.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ROUTING_BASE_URL: ${{ vars.ROUTING_BASE_URL }}
      LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
      LIVEKIT_TOKEN_ENDPOINT: ${{ vars.LIVEKIT_TOKEN_ENDPOINT }}
      LUNA_CHAT_ENDPOINT: ${{ vars.LUNA_CHAT_ENDPOINT }}
      CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
      EXPECTED_SIGNER_SHA256: 69cd0c7ef014ac419781c96304605b581e4402693383cd21c6c0e0199dd79ec8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v4

      - name: Validar configuração do aplicativo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SERVICES_JSON" ]]; then
            echo "::error::O segredo GOOGLE_SERVICES_JSON não está configurado nos Actions do repositório."
            exit 1
          fi
          if [[ -z "$LUNA_CHAT_ENDPOINT" || -z "$LIVEKIT_URL" || -z "$LIVEKIT_TOKEN_ENDPOINT" ]]; then
            echo "::error::Configure as variáveis LUNA_CHAT_ENDPOINT, LIVEKIT_URL e LIVEKIT_TOKEN_ENDPOINT nos Actions do repositório."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado no runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Conferir versão e assinatura compatível
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/35.0.0/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "versionCode='117' versionName='0.1.17'" <<< "$BADGING"
          SIGNER="$("$APKSIGNER" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')"
          if [[ "$SIGNER" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "::error::A assinatura deste build não corresponde à release pública anterior; release cancelada para evitar falha de instalação."
            exit 1
          fi
          cp "$APK" ROTA-GV-0.1.17.apk
          echo "sha256=$(sha256sum ROTA-GV-0.1.17.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s ROTA-GV-0.1.17.apk)" >> "$GITHUB_OUTPUT"

      - name: Criar manifesto de atualização
        shell: bash
        run: |
          cat > update-manifest.json <<EOF
          {
            "versionCode": 117,
            "versionName": "0.1.17",
            "channel": "stable",
            "apkUrl": "https://github.com/marlondouglas/luna-neural-space/releases/download/v0.1.17/ROTA-GV-0.1.17.apk",
            "sha256": "${{ steps.apk.outputs.sha256 }}",
            "apkSize": ${{ steps.apk.outputs.size }},
            "minSdk": 26,
            "releaseNotes": [
              "Correções e melhorias de estabilidade",
              "Ajustes de navegação, mapa, parceiros e rádio",
              "Melhorias na Luna e no painel financeiro"
            ]
          }
          EOF

      - name: Publicar release usada pelo atualizador
        run: |
          gh release create v0.1.17 ROTA-GV-0.1.17.apk update-manifest.json \
            --target "$GITHUB_SHA" \
            --title "ROTA GV 0.1.17" \
            --notes "Atualização do aplicativo ROTA GV. O manifesto contém SHA-256 para validação pelo atualizador."
